<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PsyLog - Daily Diary Booklet</title>
    <!-- Tailwind CSS Styling के लिए -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50 min-p-4 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl bg-white p-6 rounded-2xl shadow-lg border border-amber-200">
        <!-- Header -->
        <div class="flex justify-between items-center border-b pb-4 mb-4">
            <h1 class="text-2xl font-bold text-gray-800">📖 میری ڈائری (بکلیٹ)</h1>
            <span id="date-display" class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-sm font-semibold"></span>
        </div>

        <!-- Booklet Container -->
        <div id="booklet-container">
            <!-- Page Info / Counter -->
            <div class="flex justify-between items-center mb-3">
                <span id="page-counter" class="text-sm font-bold text-amber-900">صفحہ 1 از 1</span>
                <button id="add-page-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg shadow transition">+ نیا صفحہ جوڑیں</button>
            </div>

            <!-- Page Writing Area / Content Display -->
            <textarea id="page-content-input" class="w-full h-64 p-4 border border-amber-200 rounded-lg shadow-inner text-gray-700 font-serif text-lg leading-relaxed focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder="آج کے دن کے بارے میں یہاں لکھیے..."></textarea>
        </div>

        <!-- Navigation Controls (Next / Previous) -->
        <div class="flex justify-between items-center mt-6 pt-4 border-t">
            <button id="prev-btn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition disabled:opacity-40">← پچھلا صفحہ</button>
            
            <button id="save-page-btn" class="px-6 py-2 bg-amber-600 hover:bg-amber-700 text-white font-semibold rounded-lg shadow transition">تبدیلیاں محفوظ کریں</button>
            
            <button id="next-btn" class="px-4 py-2 bg-amber-600 text-white rounded-lg hover:bg-amber-700 transition disabled:opacity-40">اگلا صفحہ →</button>
        </div>
    </div>

    <!-- JavaScript Link -->
    <script src="reflect.js"></script>
</body>
</html>
